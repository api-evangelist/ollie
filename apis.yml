name: Ollie
description: >-
  Ollie (ollie.com, formerly myollie.com) is a direct-to-consumer pet health
  company that makes fresh, human-grade dog food tailored to each dog. Customers
  build a personalized meal plan from their dog's profile (breed, age, weight,
  activity, allergies), and Ollie delivers pre-portioned, chef-and-vet-developed
  recipes on a recurring subscription, along with app-based health tracking and
  check-ins. The company reports having served more than one million dogs. Ollie
  is a venture-backed consumer brand and a portfolio company of Canaan Partners;
  it operates as a subscription e-commerce and mobile-app business and does not
  publish a public developer platform, API, or developer documentation.
